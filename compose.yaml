services:
  game-server:
    build: .
    environment:
      GAME_SERVER_ADDR: 0.0.0.0:50051
      DATABASE_URL: sqlite:///data/shogi.db?mode=rwc
    ports:
      - "127.0.0.1:${GAME_SERVER_PORT:-50051}:50051"
    volumes:
      - shogi-data:/data
    init: true
    stop_signal: SIGINT
    stop_grace_period: 15s
volumes:
  shogi-data:
