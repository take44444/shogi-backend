name: OpenAPI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shogi
          POSTGRES_PASSWORD: shogi
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shogi -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://shogi:shogi@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test HTTP contracts
        run: cargo test --locked -p player-http -p user-http
      - name: Generate documents without service configuration
        run: bash scripts/generate-openapi.sh
      - name: Install OpenAPI validator
        run: python3 -m pip install openapi-spec-validator==0.9.0
      - name: Validate generated OpenAPI documents
        run: python3 -m openapi_spec_validator target/openapi/player.json target/openapi/user.json
