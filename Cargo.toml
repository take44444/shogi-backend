[workspace]
resolver = "3"
members = [
  "crates/*",
  "apps/*",
]

[workspace.dependencies]
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "net", "signal"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"
prost = "0.14.4"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
