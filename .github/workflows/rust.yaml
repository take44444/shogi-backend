name: Rust

on: [push, pull_request]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shogi
          POSTGRES_PASSWORD: shogi
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shogi -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://shogi:shogi@localhost:5432/postgres
      TEST_VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Activate pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Install traceability compiler
        run: rustup toolchain install nightly-2026-11-18 --profile minimal --component rustc-dev,llvm-tools,rust-src,rustfmt,clippy
      - name: Check test structure
        run: |
          python3 scripts/test-check-test-layout.py
          python3 scripts/check-test-layout.py
      - name: Check architecture boundaries
        run: |
          python3 scripts/check-boundaries.py
          python3 scripts/test-check-boundaries.py
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo +nightly-2026-11-18 fmt --manifest-path tools/traceability/Cargo.toml -- --check
          cargo fmt --manifest-path tools/traceability-attributes/Cargo.toml -- --check
      - name: Check lints
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo +nightly-2026-11-18 clippy --locked --manifest-path tools/traceability/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path tools/traceability-attributes/Cargo.toml --all-targets -- -D warnings
      - name: Test workspace against PostgreSQL
        run: cargo test --locked --workspace
      - name: Check compiler-derived traceability
        run: |
          python3 scripts/test-traceability.py
          python3 scripts/test-traceability-viewer.py
          python3 scripts/test-traceability-runtime.py
          python3 tools/traceability/tests/compiler_fixture.py
          python3 tools/traceability/tests/method_identity_fixture.py
          python3 tools/traceability/tests/definition_identity_fixture.py
          python3 tools/traceability/tests/external_declaration_identity_fixture.py
          cargo +nightly-2026-11-18 test --locked --manifest-path tools/traceability/Cargo.toml
          python3 scripts/test-directory-traceability.py
          python3 scripts/traceability.py check
      - name: Generate traceability viewer
        run: python3 scripts/traceability.py viewer
      - name: Upload traceability viewer
        uses: actions/upload-artifact@v7
        with:
          name: traceability-viewer
          path: target/traceability-viewer.html
          if-no-files-found: error
      - name: Check contract interfaces
        run: |
          python3 scripts/test-check-contract-interfaces.py
          python3 scripts/check-contract-interfaces.py
      - name: Check deployment isolation and grants
        run: python3 scripts/test-deployment.py
