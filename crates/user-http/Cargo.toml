[package]
name = "user-http"
version.workspace = true
edition.workspace = true
publish.workspace = true
[dependencies]
user-application = { path = "../user-application" }
async-trait = "0.1"
axum = "0.8"
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
url = "2"
thiserror = "2"
[dev-dependencies]
chrono = "0.4"
tokio.workspace = true
user-persistence = { path = "../user-persistence" }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
http-body-util = "0.1"
tempfile = "3"
[lints]
workspace = true
