[package]
name = "game-persistence"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
game-record-application = { path = "../game-record-application" }
game-application = { path = "../game-application" }
shogi-domain = { path = "../shogi-domain" }
async-trait = "0.1"
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio"] }
uuid = { version = "=1.29.0", features = ["v4"] }

sea-query-sqlx = { version = "0.9.1", default-features = false, features = ["sqlx-postgres"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
game-record-persistence = { path = "../game-record-persistence" }
tokio.workspace = true
pg-test-support = { path = "../pg-test-support" }

[lints]
workspace = true
