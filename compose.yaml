services:
  user-server:
    build: .
    profiles: [auth]
    entrypoint: ["user-server"]
    environment:
      USER_BIND_ADDR: 0.0.0.0:8080
      USER_PUBLIC_ORIGIN: ${USER_PUBLIC_ORIGIN:-http://localhost:8080}
      USER_ALLOW_LOOPBACK_HTTP: ${USER_ALLOW_LOOPBACK_HTTP:-true}
      USER_DATABASE_URL: sqlite:///data/users.db?mode=rwc
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${USER_SERVER_PORT:-8080}:8080"
    volumes:
      - user-data:/data
    init: true
    stop_signal: SIGINT
    stop_grace_period: 15s
  game-server:
    build: .
    environment:
      GAME_SERVER_ADDR: 0.0.0.0:50051
      DATABASE_URL: sqlite:///data/shogi.db?mode=rwc
    ports:
      - "127.0.0.1:${GAME_SERVER_PORT:-50051}:50051"
    volumes:
      - shogi-data:/data
    init: true
    stop_signal: SIGINT
    stop_grace_period: 15s
  player-server:
    build: .
    profiles: [records]
    entrypoint: ["player-server"]
    environment:
      PLAYER_BIND_ADDR: 0.0.0.0:8081
      PLAYER_GAME_DATABASE_PATH: /data/shogi.db
    ports:
      - "127.0.0.1:${PLAYER_SERVER_PORT:-8081}:8081"
    volumes:
      - shogi-data:/data:ro
    depends_on:
      - game-server
    init: true
    restart: on-failure
    stop_signal: SIGINT
    stop_grace_period: 15s
  outbox-publisher:
    build: .
    entrypoint: ["outbox-publisher"]
    environment:
      DATABASE_URL: sqlite:///data/shogi.db?mode=rwc
      NATS_URL: nats://nats:4222
    volumes:
      - shogi-data:/data
    depends_on:
      - game-server
      - nats
    init: true
    restart: on-failure
    stop_signal: SIGINT
    stop_grace_period: 15s
  nats:
    image: nats:2.11.10-alpine
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
volumes:
  shogi-data:
  user-data:
