services:
  game-server:
    build: .
    environment:
      GAME_SERVER_ADDR: 0.0.0.0:50051
      DATABASE_URL: sqlite:///data/shogi.db?mode=rwc
    ports:
      - "127.0.0.1:${GAME_SERVER_PORT:-50051}:50051"
    volumes:
      - shogi-data:/data
    init: true
    stop_signal: SIGINT
    stop_grace_period: 15s
  outbox-publisher:
    build: .
    entrypoint: ["outbox-publisher"]
    environment:
      DATABASE_URL: sqlite:///data/shogi.db?mode=rwc
      NATS_URL: nats://nats:4222
    volumes:
      - shogi-data:/data
    depends_on:
      - game-server
      - nats
    init: true
    restart: on-failure
    stop_signal: SIGINT
    stop_grace_period: 15s
  nats:
    image: nats:2.11.10-alpine
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
volumes:
  shogi-data:
