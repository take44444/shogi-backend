name: Rust

on: [push, pull_request]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shogi
          POSTGRES_PASSWORD: shogi
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shogi -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://shogi:shogi@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check architecture boundaries
        run: |
          python3 scripts/check-boundaries.py
          python3 scripts/test-check-boundaries.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace against PostgreSQL
        run: cargo test --locked --workspace
      - name: Check contract interfaces
        run: python3 scripts/check-contract-interfaces.py
      - name: Check deployment isolation and grants
        run: python3 scripts/test-deployment.py
